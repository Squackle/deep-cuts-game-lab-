<!doctype html><meta charset="utf-8"><title>scene</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:900px;height:600px}</style>
<canvas id="gl"></canvas>
<script type="module">
import { Scene } from '../src/rendering/scene.js';
import { T } from '../src/core/grid.js';
const q = new URLSearchParams(location.search);
const BASE = new URL('../assets/', import.meta.url).href;
const img = s => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(s); i.src = BASE + s; });
const manifest = await (await fetch(BASE + 'sprites/manifest.json')).json();
const images = {};
await Promise.all(Object.entries(manifest.sprites).map(([k, s]) => img('sprites/' + s.file).then(i => images[k] = i).catch(() => {})));
for (const k of Object.keys(manifest.sprites)) if (!images[k]) delete manifest.sprites[k];
images.terrain = await img('textures/terrain.png'); images.terrainBlur = await img('textures/terrain_blur.png'); images.foliage = await img('sprites/foliage.png');
const sc = new Scene(document.getElementById('gl'), { manifest, images, parts: {} });
sc.setQuality && sc.setQuality(q.get('q') || 'balanced');
const w = 8, h = 8, terrain = new Array(w * h).fill(T.FLOOR);
const put = (x, y, t) => terrain[y * w + x] = t;
put(1, 3, T.LEYLINE); put(3, 3, T.ARCHIVE); put(5, 3, T.RIFT); put(7, 3, T.CONDUIT);
put(1, 5, T.LEYLINE); put(3, 5, T.ARCHIVE); put(5, 5, T.RIFT); put(7, 5, T.CONDUIT);
const battle = { w, h, terrain, crystals: [{ x: 2, y: 6, charged: true }], units: [] };
sc.loadArena(battle, 7, q.get('theme') || 'hollow');
const units = [[1, 5, 'archer'], [3, 5, 'blank'], [5, 5, 'hexer'], [7, 5, 'hound'], [2, 6, 'archer']];
units.forEach(([x, y, k], i) => manifest.sprites[k] && sc.addUnit({ uid: i + 1, side: i ? 'enemy' : 'player', x, y }, k));
sc.zoom = +(q.get('zoom') || 1.15); sc.yaw = sc.yawTarget = +(q.get('yaw') || Math.PI / 4); sc.focus = [+(q.get('fx') || 0), 0, +(q.get('fz') || 0.6)]; sc.focusTarget = sc.focus.slice();
if (q.get('shadow')) { const { shadowMurder } = await import('../src/rendering/shadow-magic.js'); sc.speed = 1; shadowMurder(sc, { to: [ ...sc.world(3, 5) ].map((v, i) => i === 1 ? 0.45 : v), target: 2 }); }
const frames = +(q.get('f') || 4), step = +(q.get('dt') || 0.05); let k = 0;
const tick = () => { const t0 = performance.now(); sc.frame(step); k++; window.__ms = performance.now() - t0;
  if (k < frames) setTimeout(tick, 0); else { window.__png = document.getElementById('gl').toDataURL('image/png'); document.title = 'done'; } };
setTimeout(tick, 0);
</script>
