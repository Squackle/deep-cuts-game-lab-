<!doctype html><html><head><meta charset="utf-8"><title>GRAFTBOUND · spell VFX</title><style>html,body{margin:0;height:100%;background:#000}canvas{width:100%;height:100%;display:block}#b{position:fixed;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap}button{font:13px Georgia;padding:6px 10px}</style></head>
<body><canvas id="c"></canvas><div id="b"></div><script type="module">
// Dev: fire any spell VFX at a far target. ?fx=lightningBolt&speed=1&q=balanced&theme=hollow&auto=1
import { loadAssets } from '../src/rendering/sprites.js';
import { Scene } from '../src/rendering/scene.js';
import { VFX } from '../src/rendering/vfx.js';
import { buildEncounter } from '../src/engine/encounters.js';
import { ACTS } from '../src/data/encounters.js';
const q = new URLSearchParams(location.search);
const assets = await loadAssets(); const sc = new Scene(document.getElementById('c'), assets); sc.setQuality(q.get('q') || 'balanced'); sc.speed = +(q.get('speed') || 1);
const theme = q.get('theme') || 'hollow'; const enc = buildEncounter(ACTS[{ hollow: 0, warrens: 1, nexus: 2 }[theme]].tutorial ? ACTS[0].tutorial[0] : ACTS[1].early[0], 11, 'battle');
sc.loadArena(enc, 5, theme); sc.zoom = 1.25;
sc.addUnit({ uid: 1, side: 'player', x: 2, y: 7 }, 'blank').dir = [0.6, -1];
sc.addUnit({ uid: 2, side: 'enemy', x: 6, y: 1 }, 'hound'); sc.addUnit({ uid: 3, side: 'enemy', x: 5, y: 2 }, 'grub');
let last = performance.now(); (function loop(t) { sc.frame(Math.min(0.05, (t - last) / 1000)); last = t; requestAnimationFrame(loop); })(last);
const fire = name => { const from = sc.centerPos(1), to = sc.centerPos(2); sc.play(1, 'cast'); const tiles = [[-1, 0], [0, 0], [1, 0], [0, -1], [0, 1]].map(([dx, dy]) => { const w = sc.world(6 + dx, 1 + dy); return [w[0], 0, w[2]]; }); VFX[name](sc, { from, to, target: 2, tiles, uid: 1, uidFrom: 1 }); };
for (const k of Object.keys(VFX)) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => fire(k); document.getElementById('b').append(b); }
window.__fire = fire; window.__sc = sc;
if (q.get('auto')) setTimeout(() => fire(q.get('fx') || 'lightningBolt'), 800);
</script></body></html>
