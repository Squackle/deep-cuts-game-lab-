<!doctype html><meta charset="utf-8"><title>ui</title>
<link rel="icon" type="image/svg+xml" href="/lab/favicon.svg">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#2f4636}#app{position:relative;width:1200px;height:760px;overflow:hidden}
#scr{position:absolute;right:0;top:0;width:470px;height:760px}</style>
<body data-mode="battle"><div id="app"><div id="hud">
 <div class="gb-discard-bar" id="gb-discard-bar"></div>
 <div class="gb-card-zones" id="gb-card-zones" style="bottom:200px"></div>
 <div class="tray discard-mode" id="tray" style="position:absolute;left:10px;right:480px;bottom:10px"></div>
</div><div id="scr" class="screen show threatscr"></div></div>
<script type="module">
import { threatDialHTML } from '../src/ui/screens.js';
import { settleWorldThreat } from '../src/engine/world-threat.js';
import { exilePortalCanvas } from '../src/ui/exile-portal.js';
import { discardRequirement } from '../src/engine/zones.js';
const dr = discardRequirement({ phase: 'player', deck: { hand: [1,2,3,4,5,6,7,8], capacity: 7, pendingDiscards: 0 } });
document.getElementById('gb-discard-bar').innerHTML = `<b>${dr.text}</b><small>${dr.detail} Drag a card onto your Graveyard, or tap a card and choose Discard.</small>`;
document.getElementById('hud').classList.add('gb-discarding');
document.getElementById('gb-card-zones').innerHTML = ['Library','Graveyard','Exile'].map((n,i)=>`<button class="gb-zone gb-zone-${n.toLowerCase()}"><span class="gb-zone-art ${i===2?'gb-exile-portal':''}" ${i===2?'data-portal-slot':''}></span><span class="gb-zone-meta"><strong>${n}</strong><em>${[14,3,2][i]}</em></span></button>`).join('');
document.querySelector('[data-portal-slot]').appendChild(exilePortalCanvas());
document.getElementById('tray').innerHTML = ['Shock','Murder','Fireball','Giant Growth','Disfigure','Healing Salve','Frost Breath','Divination'].map((n,i)=>`<button class="handcard" style="position:relative;width:92px;height:130px;margin:4px;background:#e8dcc0;border-radius:8px;border:1px solid #6b5a34;font:12px serif">${n}<span class="hc-discard ${i===2?'armed':''}">Discard</span></button>`).join('');
const r = {}; settleWorldThreat({ level: 7, strongStreak: 2 }, { victory: true, enemyDamage: 0, maxHealth: 44, turns: 3, boss: true }, r);
document.getElementById('scr').innerHTML = threatDialHTML(r); document.querySelector('.threat-dial').classList.add('settled');
setTimeout(() => document.title = 'done', 300);
</script></body>
