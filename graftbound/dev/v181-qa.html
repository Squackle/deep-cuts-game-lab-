<!doctype html><meta charset="utf-8"><title>v181</title>
<link rel="icon" type="image/svg+xml" href="/lab/favicon.svg">
<style>html,body{margin:0;background:#000}canvas{display:block;width:1000px;height:640px}</style>
<canvas id="gl"></canvas>
<script type="module">
// v1.8.1 QA: real loadAssets + Scene: refined bosses, repaired golems, 2x status visuals, Electrostatic arcs.
import { loadAssets } from '../src/rendering/sprites.js';
import { Scene } from '../src/rendering/scene.js';
import { T } from '../src/core/grid.js';
import { statusVisuals } from '../src/ui/battle-ui.js';
const q = new URLSearchParams(location.search);
const assets = await loadAssets(); const sc = new Scene(document.getElementById('gl'), assets); sc.setQuality && sc.setQuality('balanced');
const w = 8, h = 8, terrain = new Array(w * h).fill(T.FLOOR); sc.loadArena({ w, h, terrain, crystals: [], units: [] }, 7, q.get('theme') || 'nexus');
const set = q.get('set') || 'golem';
const L = set === 'boss' ? [[1, 2, 'mtg_nemata'], [4, 2, 'mtg_drakuseth'], [6, 4, 'mtg_toxrill'], [3, 5, 'blank']]
  : [[1, 3, 'mtg_golemVigilance'], [3, 3, 'mtg_golemTrample'], [5, 3, 'mtg_sentinel'], [2, 5, 'mtg_nullwarden'], [4, 5, 'blank'], [6, 5, 'mtg_friendlySoldier']];
L.forEach(([x, y, k], i) => { if (!assets.manifest.sprites[k]) return; const v = sc.addUnit({ uid: i + 1, side: k === 'blank' || k === 'mtg_friendlySoldier' ? 'player' : 'enemy', x, y }, k);
  if (set === 'golem') v.statusFx = statusVisuals(k === 'blank' ? { empowered: 2, guard: 2 } : k === 'mtg_friendlySoldier' ? { shield: 3 } : i === 0 ? { poison: 2 } : i === 1 ? { weakened: 1 } : {});
  if (k === 'blank') v.electro = true; });
sc.zoom = +(q.get('zoom') || 1.4); sc.focus = [0, 0, 0.2]; sc.focusTarget = sc.focus.slice();
let k = 0; const tick = () => { sc.frame(0.2); k++; if (k < 18) setTimeout(tick, 0); else { window.__png = document.getElementById('gl').toDataURL('image/png'); document.title = 'done'; } }; setTimeout(tick, 0);
</script>
