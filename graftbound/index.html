<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1a14">
<title>GRAFTBOUND — Begin as nothing. Become everything.</title>
<meta name="description" content="GRAFTBOUND: an HD-2D tactical RPG. Begin as a blank 1/1 creature, win battles, open boosters of real Magic cards and graft creatures into yourself across three acts. A Deep Cuts EDH Game Lab game.">
<meta name="application-name" content="GRAFTBOUND">
<meta property="og:title" content="GRAFTBOUND">
<meta property="og:description" content="Begin as nothing. Become everything. An HD-2D creature-grafting tactics RPG from the Deep Cuts EDH Game Lab.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://deep-cuts-game-lab.pages.dev/graftbound/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%230d1a14'/%3E%3Cpath d='M7 3h10l2 2v14l-2 2H7l-2-2V5z' fill='none' stroke='%23e9c972' stroke-width='1.4'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23e9c972'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="title">
<div id="app">
  <canvas id="gl" aria-label="Battlefield"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="hud" class="hidden">
    <div class="plate" id="plate" role="button" tabindex="0" aria-label="Your creature — open character sheet"></div>
    <div class="encounter"><span id="enc-name"></span><span id="enc-turn"></span></div>
    <div class="tray" id="tray" aria-label="Spellbook"></div>
    <button type="button" id="endTurn" class="end-turn">End Turn <kbd>Space</kbd></button>
    <div class="inspect" id="inspect" aria-live="polite"></div>
    <div class="banner" id="banner"></div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="taphint" id="taphint">Tap again to confirm</div>
  </div>
  <div class="topbtns">
    <button type="button" id="btn-rotl" class="ibtn" aria-label="Rotate camera left"></button>
    <button type="button" id="btn-rotr" class="ibtn" aria-label="Rotate camera right"></button>
    <button type="button" id="btn-sheet" class="ibtn" aria-label="Character sheet and spellbook"></button>
    <button type="button" id="btn-sound" class="ibtn" aria-label="Sound"></button>
    <button type="button" id="btn-menu" class="ibtn" aria-label="Menu"></button>
  </div>
  <div id="screen" class="screen"></div>
  <div id="bigtext" aria-live="polite"></div>
  <div id="hint" class="hint" role="status"></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="tip" class="tip"></div>
  <div id="modal"></div>
  <div id="loading"><div class="load-logo">GRAFT<b>BOUND</b></div><p>Begin as nothing. Become everything.</p><div class="loadtrack"><i id="loadbar"></i></div></div>
  <div id="nogl" hidden><p>GRAFTBOUND needs WebGL2. Please try a current browser.</p></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
