<!doctype html><html><head><meta charset="utf-8"><title>GRAFTBOUND · HD-2D benchmark</title><style>html,body{margin:0;height:100%;background:#000}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
// Visual benchmark: a grafted creature vs. a mixed enemy group, with a spell in flight. ?q=high|balanced|performance&cards=a,b,c
import { loadAssets } from '../src/rendering/sprites.js';
import { Scene } from '../src/rendering/scene.js';
import { composePlayerSheet } from '../src/rendering/evolution-visuals.js';
import { deriveAppearance } from '../src/engine/appearance.js';
import { newEvolution, absorb } from '../src/engine/evolution.js';
import { installReferenceSet } from '../src/cards/reference-set.js';
import { resolveCard } from '../src/cards/catalog.js';
installReferenceSet();
const q = new URLSearchParams(location.search);
const assets = await loadAssets(); const sc = new Scene(document.getElementById('c'), assets); sc.setQuality(q.get('q') || 'balanced');
const terrain = new Array(64).fill(0); [10, 13, 37].forEach(i => terrain[i] = 1); [27, 44].forEach(i => terrain[i] = 2); [50, 21].forEach(i => terrain[i] = 3);
sc.loadArena({ w: 8, h: 8, terrain }, 11);
let evo = newEvolution(); for (const id of (q.get('cards') || 'mtg:youthful-knight,mtg:serra-angel,mtg:vampire-nighthawk').split(',')) evo = absorb(evo, resolveCard(id)).evo;
const ap = deriveAppearance(evo);
const pv = sc.addUnit({ uid: 1, side: 'player', x: 3, y: 5 }, 'blank'); sc.setUnitTexture(1, composePlayerSheet(assets, ap), ap.size); pv.dir = [0, -1];
sc.addUnit({ uid: 2, side: 'enemy', x: 3, y: 2 }, 'alpha'); sc.addUnit({ uid: 3, side: 'enemy', x: 5, y: 3 }, 'hound'); sc.addUnit({ uid: 4, side: 'enemy', x: 1, y: 1 }, 'hexer'); sc.addUnit({ uid: 5, side: 'enemy', x: 6, y: 1 }, 'moth');
sc.setOverlay([{ x: 3, y: 4, col: [0.95, 0.78, 0.35, 0.25] }, { x: 2, y: 5, col: [0.95, 0.78, 0.35, 0.25] }, { x: 4, y: 5, col: [0.95, 0.78, 0.35, 0.25] }, { x: 3, y: 2, col: [1, 0.3, 0.2, 0.85], ring: true }]);
sc.zoom = +(q.get('zoom') || 1.35); sc.focusTarget = [0, 0, -0.3]; sc.focus = [0, 0, -0.3];
let last = performance.now(), n = 0;
function loop(t) { sc.frame(Math.min(0.05, (t - last) / 1000)); last = t; n++; if (n === 2) { const from = sc.centerPos(1), to = sc.centerPos(2); sc.light([(from[0] + to[0]) / 2, 0.9, (from[2] + to[2]) / 2], [1, 0.5, 0.18], 3.2, 99, 2.2); for (let k = 0; k < 14; k++) { const t2 = k / 14; sc.fx.emit({ pos: [from[0] + (to[0] - from[0]) * t2, 0.6 + Math.sin(t2 * 3.14) * 0.5, from[2] + (to[2] - from[2]) * t2], col: [1, 0.55, 0.2, 1], size: 34 - k, life: 99, drag: 0 }, true); } sc.play(1, 'cast'); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__bench = { sc, fps: () => n };
</script></body></html>
