name: Game Lab deployed route health
on:
  schedule:
    - cron: '43 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-live-health
  cancel-in-progress: false
jobs:
  deployed-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tests/lab-live-health.test.mjs
      - run: node scripts/lab-live-health.mjs
