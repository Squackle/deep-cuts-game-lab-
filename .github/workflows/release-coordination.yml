name: Release coordination
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  # Required by the protected main-branch gate: release-coordination must fail
  # if any current unified game engine, catalog or syntax test fails.
  game-lab-suite:
    uses: ./.github/workflows/lab-catalog.yml
    permissions:
      contents: read

  release-coordination:
    needs: game-lab-suite
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never let an unsuccessful prerequisite be treated as a skipped/green
      # required check. A failed/cancelled suite must make this job fail.
      - name: Require the full Game Lab test suite to pass
        env:
          SUITE_RESULT: ${{ needs.game-lab-suite.result }}
        run: test "$SUITE_RESULT" = "success"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify collision checker contract
        run: node --test tests/release-coordination.test.mjs
      - name: Verify PR ownership, promotion evidence and concurrent changes
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-coordination.mjs
