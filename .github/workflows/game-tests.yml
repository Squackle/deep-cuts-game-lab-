name: Hive Run prototype checks
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "index.html"
      - "styles.css"
      - ".github/workflows/game-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "index.html"
      - "styles.css"
      - ".github/workflows/game-tests.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic arcade-engine regression suite
        run: node --test tests/*.test.mjs
      - name: Check source module syntax
        run: |
          node --check src/engine.js
          node --check src/miniboss.js
          node --check src/boss-art.js
          node --check src/game-only.js
          node --check src/main.js
          node --check src/creature-sprites.js
          node --check src/level-background.js
          node --check src/pickups.js
          node --check src/soundtrack.js
          node --check src/evolution-ui.js
          node --check src/evolution-visuals.js
          node --check src/enemies.js
          node --check src/enemy-render.js
          node --check src/leaderboard-client.js
          node --check src/leaderboard-ui.js
          node --check src/integration.js
          node --check functions/api/leaderboard.js
