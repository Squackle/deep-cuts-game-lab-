 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".85"/></filter>
 <filter id="smoke"><feGaussianBlur stdDeviation="4"/></filter>
