 <linearGradient id="wing" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#a9d59e"/><stop offset=".22" stop-color="#537e68"/><stop offset=".74" stop-color="#203e36"/><stop offset="1" stop-color="#0b2421"/></linearGradient>
